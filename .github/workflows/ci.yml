name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install the MoonBit toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.13+cbb11c36f
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Fetch the module registry
        run: moon update

      - name: Check
        run: |
          moon check --target native
          moon check --target js

      - name: Unit tests
        run: moon test --target native

      - name: Build
        run: |
          moon build --target native --release
          moon build --target js --release

      - name: Integration tests against the native binary
        run: |
          ./_build/native/release/build/cmd/itest/itest.exe \
            --bin "$PWD/_build/native/release/build/cmd/moongate/moongate.exe" \
            --action "$PWD/dist/index.js"

      - name: Integration tests against the shipped bundle
        run: |
          ./_build/native/release/build/cmd/itest/itest.exe \
            --bin node --bin-arg "$PWD/dist/moongate.js" \
            --action "$PWD/dist/index.js"

      - name: Committed bundle is current
        run: |
          set -euo pipefail
          # dist/ is what callers execute, so a stale bundle is a shipped bug.
          cp _build/js/release/build/cmd/moongate-js/moongate-js.js dist/moongate.js
          git diff --exit-code -- dist/

      - name: Validate the repository configuration
        run: |
          ./_build/native/release/build/cmd/moongate/moongate.exe \
            validate --config .moongate.json --format json

      - name: Skill frontmatter parses as YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_skills.py

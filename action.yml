name: Moongate
description: Evaluate committed repository changes against semantic rules with TypeSafe Jev
author: brickfrog

inputs:
  base:
    description: Base commit or ref. Policy is always read from this commit.
    required: true
  head:
    description: Head commit or ref to evaluate.
    required: true
  repository:
    description: Working directory of the repository under evaluation.
    required: false
    default: "."
  config:
    description: Repository-root-relative configuration path.
    required: false
    default: .moongate.json
  api-key:
    description: TypeSafe API key. Reaches the runner through the environment only.
    required: true

# The runner is compiled to JavaScript and committed under dist/, so a caller
# needs no MoonBit toolchain and no build step. Regenerate with
# `moon build --target js --release`; CI fails if dist/ is stale.
runs:
  using: node24
  main: dist/index.js
